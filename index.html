<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Food Ordering</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>🍱 <span id="app-name">Office Food Ordering</span></h1>
      <p>เลือกเมนูที่ชอบ แล้วดูสรุปรายการได้ทันที</p>
    </div>
    <a href="#summary" class="cart-pill" aria-label="ไปที่สรุปรายการ">🛒 <span id="cart-badge">0</span></a>
  </header>
  <main class="layout">
    <section class="menu" aria-labelledby="menu-h">
      <h2 id="menu-h">เมนูอาหาร</h2>
      <div id="menu-state" class="menu-state" role="status"></div>
      <div id="menu-grid" class="menu-grid"></div>
    </section>
    <aside id="summary" class="summary" aria-labelledby="sum-h">
      <h2 id="sum-h">สรุปรายการที่สั่ง</h2>
      <ul id="sum-lines" class="sum-lines" aria-live="polite"></ul>
      <div class="sum-foot">
        <div><span>จำนวนรวม</span><b id="sum-qty">0 ชิ้น</b></div>
        <div class="grand"><span>ราคารวมทั้งหมด</span><b id="sum-total">0.00 บาท</b></div>
      </div>
    </aside>
  </main>
  <footer class="footer"><span id="app-version"></span></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
